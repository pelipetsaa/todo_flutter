name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with the local toolchain (flutter --version).
  FLUTTER_VERSION: 3.41.6

jobs:
  quality:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Fix locally with `dart format .`; the line width comes from analysis_options.yaml.
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Coverage summary
        run: |
          awk -F: '/^LF:/ {total += $2} /^LH:/ {hit += $2}
            END { if (total) printf "- line coverage: %.1f%% (%d of %d lines)\n", 100 * hit / total, hit, total }' \
            coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  e2e:
    name: Client against a running server
    runs-on: ubuntu-latest
    services:
      # Same database as ToDoList's docker-compose.yml, so the server starts with its development defaults.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: todolist
          POSTGRES_USER: todolist
          POSTGRES_PASSWORD: todolist
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U todolist -d todolist"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # The backend lives in its own repository; the latest main is what the deployed server runs.
      - uses: actions/checkout@v7
        with:
          repository: pelipetsaa/ToDoList
          path: backend
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          build-root-directory: backend
      - name: Start the server
        working-directory: backend
        run: |
          ./gradlew :server:buildFatJar
          nohup java -jar server/build/libs/server-all.jar > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health/ready && exit 0
            sleep 2
          done
          cat server.log
          exit 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Run the client's HTTP stack against it
        env:
          E2E_BASE_URL: http://localhost:8080
        run: flutter test test/e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-log
          path: backend/server.log

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The release build runs R8, so minification problems surface here rather than in a release.
      - run: flutter build apk --debug
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Compiles the release app without signing; signing happens in the release workflow.
      - run: flutter build ios --release --no-codesign
